<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PNG 批量转 PDF（按地名分类）</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #1a1a2e;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 680px;
    }

    .drop-zone {
      border: 2px dashed #c0c8d4;
      border-radius: 10px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #f8f9fb;
      position: relative;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #4a90e2;
      background: #eef4fd;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2.4rem;
      margin-bottom: 12px;
    }

    .drop-label {
      font-size: 1rem;
      color: #4a90e2;
      font-weight: 500;
    }

    .drop-hint {
      font-size: 0.82rem;
      color: #888;
      margin-top: 6px;
    }

    #file-list {
      margin-top: 20px;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #e8ecf0;
      border-radius: 8px;
      display: none;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-bottom: 1px solid #f0f2f5;
      font-size: 0.86rem;
    }

    .file-item:last-child { border-bottom: none; }

    .file-item .tag {
      background: #e8f0fe;
      color: #4a90e2;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .file-name { flex: 1; word-break: break-all; color: #444; }

    .file-status { font-size: 0.78rem; color: #aaa; white-space: nowrap; }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    #btn-convert {
      background: #4a90e2;
      color: #fff;
    }

    #btn-reset {
      background: #f0f2f5;
      color: #555;
    }

    #progress-wrap {
      margin-top: 20px;
      display: none;
    }

    .progress-bar-bg {
      background: #e8ecf0;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #4a90e2;
      border-radius: 99px;
      width: 0%;
      transition: width 0.2s;
    }

    .progress-label {
      font-size: 0.82rem;
      color: #666;
      margin-top: 6px;
    }

    #result-section {
      margin-top: 24px;
      display: none;
    }

    .result-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }

    .group-list {
      border: 1px solid #e8ecf0;
      border-radius: 8px;
      overflow: hidden;
      max-height: 200px;
      overflow-y: auto;
    }

    .group-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 14px;
      border-bottom: 1px solid #f0f2f5;
      font-size: 0.86rem;
    }

    .group-item:last-child { border-bottom: none; }

    .group-name { font-weight: 500; color: #2c3e50; }
    .group-count { color: #888; font-size: 0.8rem; }

    #btn-download {
      margin-top: 16px;
      width: 100%;
      background: #27ae60;
      color: #fff;
      padding: 13px 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #btn-download:hover { opacity: 0.88; }

    .notice {
      margin-top: 24px;
      background: #fff8e1;
      border-left: 3px solid #f5a623;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #7a5f00;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>PNG 批量转 PDF</h1>
  <p class="subtitle">按文件名开头的中文地名自动分类，保持原始尺寸与内容</p>

  <div class="card">
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" multiple accept=".png,image/png" />
      <div class="drop-icon">🖼️</div>
      <div class="drop-label">点击选择或拖拽 PNG 文件到此处</div>
      <div class="drop-hint">支持批量选择，文件名需以中文地名开头</div>
    </div>

    <div id="file-list"></div>

    <div class="actions">
      <button id="btn-reset" onclick="reset()">清空</button>
      <button id="btn-convert" disabled onclick="startConvert()">开始转换</button>
    </div>

    <div id="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="progress-label" id="progress-label">准备中…</div>
    </div>

    <div id="result-section">
      <div class="result-title">转换完成，按地名分类如下：</div>
      <div class="group-list" id="group-list"></div>
      <button id="btn-download" onclick="downloadZip()">📥 下载全部 PDF（ZIP 压缩包）</button>
    </div>

    <div class="notice">
      说明：每个 PNG 会生成与图片像素尺寸完全一致的 PDF 页面，文件名保持不变（扩展名改为 .pdf）。
      地名识别规则：取文件名开头连续的中文字符作为地名；若无中文开头则归入「其他」文件夹。
    </div>
  </div>

  <script>
    const { PDFDocument } = PDFLib;

    let selectedFiles = [];
    let zipBlob = null;

    // ── 文件选择 ──────────────────────────────────────────────
    const fileInput = document.getElementById('file-input');
    const dropZone  = document.getElementById('drop-zone');

    fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const pngs = Array.from(e.dataTransfer.files).filter(f => f.type === 'image/png' || f.name.toLowerCase().endsWith('.png'));
      handleFiles(pngs);
    });

    function handleFiles(files) {
      if (!files.length) return;
      selectedFiles = files;
      zipBlob = null;
      document.getElementById('result-section').style.display = 'none';
      renderFileList();
      document.getElementById('btn-convert').disabled = false;
    }

    function extractPlaceName(filename) {
      const base = filename.replace(/\.png$/i, '');
      const m = base.match(/^[一-鿿㐀-䶿]+/);
      return m ? m[0] : '其他';
    }

    function renderFileList() {
      const el = document.getElementById('file-list');
      el.style.display = 'block';
      el.innerHTML = selectedFiles.map(f => `
        <div class="file-item">
          <span class="tag">${extractPlaceName(f.name)}</span>
          <span class="file-name">${f.name}</span>
          <span class="file-status" id="status-${CSS.escape(f.name)}">待转换</span>
        </div>`).join('');
    }

    // ── 转换 ───────────────────────────────────────────────────
    async function startConvert() {
      if (!selectedFiles.length) return;

      document.getElementById('btn-convert').disabled = true;
      document.getElementById('btn-reset').disabled   = true;
      const progressWrap = document.getElementById('progress-wrap');
      const progressBar  = document.getElementById('progress-bar');
      const progressLabel = document.getElementById('progress-label');
      progressWrap.style.display = 'block';
      zipBlob = null;

      const zip = new JSZip();
      const groups = {};

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const placeName = extractPlaceName(file.name);
        const pdfName   = file.name.replace(/\.png$/i, '.pdf');

        progressLabel.textContent = `正在处理 ${i + 1} / ${selectedFiles.length}：${file.name}`;
        progressBar.style.width   = `${((i) / selectedFiles.length) * 100}%`;

        try {
          const pdfBytes = await pngFileToPdf(file);

          if (!groups[placeName]) groups[placeName] = 0;
          groups[placeName]++;

          zip.folder(placeName).file(pdfName, pdfBytes);

          const statusEl = document.getElementById(`status-${CSS.escape(file.name)}`);
          if (statusEl) { statusEl.textContent = '✅ 完成'; statusEl.style.color = '#27ae60'; }
        } catch (err) {
          console.error(file.name, err);
          const statusEl = document.getElementById(`status-${CSS.escape(file.name)}`);
          if (statusEl) { statusEl.textContent = '❌ 失败'; statusEl.style.color = '#e74c3c'; }
        }

        // yield to keep UI responsive
        await new Promise(r => setTimeout(r, 0));
      }

      progressBar.style.width = '100%';
      progressLabel.textContent = `全部完成，共 ${selectedFiles.length} 个文件。`;

      zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });

      renderGroups(groups);
      document.getElementById('result-section').style.display = 'block';
      document.getElementById('btn-reset').disabled = false;
    }

    async function pngFileToPdf(file) {
      const { width, height } = await getImageDimensions(file);

      // Scale so the longest side equals 10 cm (1 cm = 28.3465 pt)
      const MAX_PT = 10 * 28.3465;
      const scale  = MAX_PT / Math.max(width, height);
      const pageW  = width  * scale;
      const pageH  = height * scale;

      // Render PNG → JPEG via Canvas for maximum PDF reader compatibility.
      // Direct PNG embedding is not supported by many readers (especially on
      // older systems and domestic software); JPEG is universally accepted.
      const jpegBytes = await pngToJpegBytes(file, width, height);

      const pdfDoc = await PDFDocument.create();
      const jpgImage = await pdfDoc.embedJpg(jpegBytes);

      const page = pdfDoc.addPage([pageW, pageH]);
      page.drawImage(jpgImage, { x: 0, y: 0, width: pageW, height: pageH });

      return pdfDoc.save();
    }

    function pngToJpegBytes(file, width, height) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const canvas = document.createElement('canvas');
          canvas.width  = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; // flatten transparency to white
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(blob => {
            blob.arrayBuffer()
              .then(buf => resolve(new Uint8Array(buf)))
              .catch(reject);
          }, 'image/jpeg', 0.95);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法读取图片')); };
        img.src = url;
      });
    }

    function getImageDimensions(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload  = () => { URL.revokeObjectURL(url); resolve({ width: img.naturalWidth, height: img.naturalHeight }); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法读取图片尺寸')); };
        img.src = url;
      });
    }

    function renderGroups(groups) {
      const el = document.getElementById('group-list');
      el.innerHTML = Object.entries(groups)
        .sort((a, b) => a[0].localeCompare(b[0]))
        .map(([name, count]) => `
          <div class="group-item">
            <span class="group-name">📁 ${name}</span>
            <span class="group-count">${count} 个文件</span>
          </div>`).join('');
    }

    // ── 下载 ───────────────────────────────────────────────────
    function downloadZip() {
      if (!zipBlob) return;
      saveAs(zipBlob, 'PDF_按地名分类.zip');
    }

    // ── 重置 ───────────────────────────────────────────────────
    function reset() {
      selectedFiles = [];
      zipBlob = null;
      fileInput.value = '';
      document.getElementById('file-list').style.display  = 'none';
      document.getElementById('file-list').innerHTML       = '';
      document.getElementById('progress-wrap').style.display = 'none';
      document.getElementById('result-section').style.display = 'none';
      document.getElementById('progress-bar').style.width  = '0%';
      document.getElementById('btn-convert').disabled = true;
      document.getElementById('btn-reset').disabled   = false;
    }
  </script>
</body>
</html>
